<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple AI Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'chat_app/styles.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-3 py-md-4">
    <section class="chat-shell mx-auto shadow-sm rounded-4 bg-white d-flex flex-column">
      <header class="chat-header px-3 px-md-4 py-3 border-bottom">
        <h1 class="h5 mb-1">AI Chat</h1>
        <p class="small text-muted mb-0">Простой чат с сохранением истории в SQLite</p>
      </header>

      <div id="chat-log" class="chat-log p-3 p-md-4">
        {% for msg in messages %}
          <div class="d-flex mb-3 {% if msg.role == 'user' %}justify-content-end{% else %}justify-content-start{% endif %}">
            <div class="msg-bubble {% if msg.role == 'user' %}msg-user{% else %}msg-ai{% endif %}">
              <div class="msg-role small text-muted mb-1">{% if msg.role == 'user' %}Вы{% else %}AI{% endif %}</div>
              <div class="msg-content">{{ msg.content|linebreaksbr }}</div>
            </div>
          </div>
        {% empty %}
          <div class="text-center text-muted small" id="empty-state">Начните диалог: отправьте первое сообщение.</div>
        {% endfor %}
      </div>

      <form id="chat-form" class="chat-form border-top p-2 p-md-3">
        {% csrf_token %}
        <div class="input-group">
          <textarea id="message-input" class="form-control" rows="1" placeholder="Введите сообщение..." required></textarea>
          <button id="send-btn" class="btn btn-primary px-4" type="submit">Отправить</button>
        </div>
      </form>
    </section>
  </main>

  <script src="{% static 'chat_app/chat.js' %}"></script>
</body>
</html>
